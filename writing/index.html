<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Writing · Fatima Salehbhai</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../site.css"><script>try{var s=localStorage.getItem("brew");if(s)document.documentElement.dataset.theme=s}catch(e){}</script></head>
<body><main>
<div class="crumb"><a href="../">Fatima Salehbhai</a> / writing</div>
<h1>Writing</h1>
<p class="lede">Old posts I'm digging back up, and new ones as I write them.</p>
<div id="list"></div>
</main>
<script>
fetch('posts.json',{cache:'no-cache'}).then(r=>r.json()).then(posts=>{
  const el=document.getElementById('list');
  if(!posts.length){ el.innerHTML='<div class="empty">The first posts are being dug out of old drafts. Check back soon.</div>'; return; }
  posts.sort((a,b)=>b.date.localeCompare(a.date));
  el.innerHTML=posts.map(p=>'<a class="row" href="'+(p.url||('post.html?p='+encodeURIComponent(p.slug)))+'"><span class="t">'+p.title+'</span><span class="d">'+p.date.slice(0,4)+'</span>'+(p.summary?'<span class="s">'+p.summary+'</span>':'')+'</a>').join('');
});
</script></body></html>
