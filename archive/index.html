<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Handmade Web</title><meta name="description" content="Weird, wonderful corners of the internet, made by people.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../site.css"><script>try{var s=localStorage.getItem("brew");if(s)document.documentElement.dataset.theme=s}catch(e){}</script>
<style>
.portal{margin:8px 0 12px;padding:28px 24px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:center}
.go{font:inherit;font-size:17px;font-weight:600;padding:14px 22px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--card);cursor:pointer;transition:transform .15s}
.go:hover{transform:translateY(-1px) rotate(-1deg)}.go:active{transform:scale(.97)}
.pick{margin-top:22px;text-align:left}
.pick .t{font-size:20px;font-weight:600}.pick .m{color:var(--muted);font-size:14px;margin:2px 0 8px}.pick .w{margin:0 0 14px}
.pick a.visit{font-weight:600;color:var(--accent);text-decoration:none}.pick a.visit:hover{text-decoration:underline}
.pick{animation:pop .35s cubic-bezier(.3,1.5,.5,1)}@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.filters button{font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--card)}
.count{color:var(--muted);font-size:13px;margin-bottom:8px}
.foot{margin-top:40px;color:var(--muted);font-size:14px}
</style></head>
<body><main>
<div class="crumb"><a href="../">Fatima Salehbhai</a> / archive</div>
<h1>The Handmade Web</h1>
<p class="lede">Weird, wonderful corners of the internet, made by people. Some are older than Google. All of them were made by hand.</p>
<div class="portal"><button class="go" id="go" type="button">take me somewhere</button><div id="pick"></div></div>
<h2>Browse</h2>
<div class="filters" id="filters"></div>
<div class="count" id="count"></div>
<div id="list"></div>
<p class="foot">Know a place that belongs here? Send it to fatima.salehbhai@gmail.com.</p>
</main>
<script>
fetch('archive.json',{cache:'no-cache'}).then(r=>r.json()).then(items=>{
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const meta=i=>[i.year,i.by].filter(Boolean).map(esc).join(' · ');
  let last=-1, tag='all';
  document.getElementById('go').addEventListener('click',()=>{
    let n; do{ n=Math.floor(Math.random()*items.length); }while(items.length>1&&n===last); last=n; const i=items[n];
    document.getElementById('go').textContent='somewhere else';
    const el=document.getElementById('pick'); el.innerHTML='';
    el.innerHTML='<div class="pick"><div class="t">'+esc(i.title)+'</div>'+(meta(i)?'<div class="m">'+meta(i)+'</div>':'')+'<p class="w">'+esc(i.why)+'</p><a class="visit" href="'+esc(i.url)+'" target="_blank" rel="noopener">go there &rarr;</a></div>';
  });
  const tags=['all',...[...new Set(items.flatMap(i=>i.tags))].sort()];
  const fl=document.getElementById('filters');
  fl.innerHTML=tags.map(t=>'<button type="button" data-t="'+esc(t)+'" aria-pressed="'+(t==='all')+'">'+esc(t)+'</button>').join('');
  fl.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; tag=b.dataset.t; fl.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); render();});
  function render(){ const shown=items.filter(i=>tag==='all'||i.tags.includes(tag));
    document.getElementById('count').textContent=shown.length+' places';
    document.getElementById('list').innerHTML=shown.map(i=>'<a class="row" href="'+esc(i.url)+'" target="_blank" rel="noopener"><span class="t">'+esc(i.title)+'</span><span class="d">'+esc(i.year||'')+'</span><span class="s">'+esc(i.why)+(i.by?' <em>'+esc(i.by)+'</em>':'')+'</span></a>').join(''); }
  render();
});
</script></body></html>
