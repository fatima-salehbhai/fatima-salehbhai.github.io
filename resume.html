<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Resume · Fatima Salehbhai</title>
<style>
  :root{--bg:#fbf9f6;--fg:#1e1511;--muted:#76675e;--line:#ebe4dd;--link:#1e1511;--accent:#3d2a20;--card:#ffffff}
  @media (prefers-color-scheme:dark){:root:not([data-theme="boba"]){--bg:#2a1a12;--fg:#f3e4d2;--muted:#bfa58f;--line:#4a3325;--link:#f3e4d2;--accent:#d8bb9c;--card:#34221a}}
  :root[data-theme="chai"]{--bg:#2a1a12;--fg:#f3e4d2;--muted:#bfa58f;--line:#4a3325;--link:#f3e4d2;--accent:#d8bb9c;--card:#34221a}
  body{margin:0;background:var(--bg);transition:background .4s,color .4s;color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  main{max-width:640px;margin:0 auto;padding:72px 24px}
  h1{font-size:22px;font-weight:600;margin:0 0 8px}
  p{color:var(--muted);margin:0 0 20px}
  form{display:flex;gap:8px;flex-wrap:wrap}
  input{flex:1;min-width:200px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg)}
  button{font:inherit;padding:10px 16px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:var(--bg);cursor:pointer}
  .err{color:#c0392b;margin-top:12px;min-height:1.5em}
  a{color:var(--fg)}
  iframe{width:100%;height:85vh;border:1px solid var(--line);border-radius:8px;margin-top:20px}
</style>
</head>
<body>
<main>
  <h1>Resume</h1>
  <p>This file is password protected. If you were given a password, enter it below. Otherwise, <a href="mailto:fatima.salehbhai@gmail.com">email me</a> and I'll send it over.</p>
  <form id="f">
    <input id="pw" type="password" placeholder="Password" autocomplete="off" autofocus>
    <button type="submit">Open</button>
  </form>
  <div class="err" id="err"></div>
  <div id="out"></div>
</main>
<script>
try{ var s=localStorage.getItem('brew'); if(s) document.documentElement.dataset.theme=s; }catch(e){}
const enc = fetch('resume.enc').then(r => r.arrayBuffer());
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  try {
    const buf = new Uint8Array(await enc);
    const salt = buf.slice(0,16), iv = buf.slice(16,28), ct = buf.slice(28);
    const pw = new TextEncoder().encode(document.getElementById('pw').value);
    const base = await crypto.subtle.importKey('raw', pw, 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:300000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pdf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
    const url = URL.createObjectURL(new Blob([pdf], {type:'application/pdf'}));
    document.getElementById('out').innerHTML = '<p><a href="'+url+'" download="Fatima_Salehbhai_Resume.pdf">Download PDF</a></p><iframe src="'+url+'"></iframe>';
    document.getElementById('f').hidden = true;
  } catch (_) { err.textContent = 'That password did not work.'; }
});
</script>
</body>
</html>
